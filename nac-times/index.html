<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAC Times</title>
<meta name="description" content="NAC Times — phân tích, so sánh và góc nhìn về di trú đầu tư dành cho nhà đầu tư Việt.">
<meta name="robots" content="noindex">
<link rel="icon" href="https://nomadassetcollective.com/wp-content/uploads/2026/04/cropped-OTG-Passport-Icons.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F6F6F2; --sheet:#FFFFFF; --ink:#15171C; --ink-2:#4E525B; --ink-3:#8A8D93;
  --rule:#DCDCD6; --rule-2:#EBEBE6; --accent:#1800AD; --accent-soft:#ECEAFB; --live:#F4622A; --wa:#1FA855;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --measure:40rem; --rail:170px; --gap:48px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --paper:#101216; --sheet:#171A20; --ink:#ECEBE6; --ink-2:#B4B5B8; --ink-3:#7D8087;
  --rule:#2C3038; --rule-2:#22252C; --accent:#A8A2FF; --accent-soft:#23214A; --live:#FF7A45;}}
:root[data-theme="dark"]{
  color-scheme:dark; --paper:#101216; --sheet:#171A20; --ink:#ECEBE6; --ink-2:#B4B5B8; --ink-3:#7D8087;
  --rule:#2C3038; --rule-2:#22252C; --accent:#A8A2FF; --accent-soft:#23214A; --live:#FF7A45;}

*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 19px/1.62 var(--serif);font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
.label{font:500 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.label.ink{color:var(--ink)}
.label.acc{color:var(--accent)}
.sans{font-family:var(--sans)}
.live{display:inline-flex;align-items:center;gap:7px;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 2.4s ease-out infinite}
.live.off::before{background:var(--ink-3);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}

/* ── Masthead: one quiet line; the tools live in it ── */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule)}
.mast .wrap{display:flex;align-items:center;gap:20px;height:54px}
.brand{font:500 22px/1 var(--serif);letter-spacing:-.01em;white-space:nowrap}
.brand i{font-style:italic;font-weight:400}
.mast .sec{font:500 12px/1 var(--sans);color:var(--ink-2);padding-left:20px;border-left:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--sheet)}
.seg button{white-space:nowrap;border:0;background:none;font:500 12px/1 var(--sans);padding:7px 11px;border-radius:999px;cursor:pointer;color:var(--ink-2);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.book{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);font:500 12.5px/1 var(--sans);padding:10px 14px;border-radius:999px;white-space:nowrap}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);transition:width .12s linear}
.sections{border-bottom:1px solid var(--rule)}
.sections .wrap{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;height:44px;align-items:center}
.sections .wrap::-webkit-scrollbar{display:none}
.sections a{font:500 12.5px/1 var(--sans);color:var(--ink-2);white-space:nowrap;padding-block:14px;border-bottom:2px solid transparent}
.sections a:hover{color:var(--ink)}
.sections a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ── Opening: rail · headline ── */
.open{padding-block:56px 32px;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);column-gap:var(--gap)}
.open .rail-o{grid-row:1/span 5;display:grid;gap:18px;align-content:start;padding-top:6px;font:400 12px/1.5 var(--sans);color:var(--ink-3)}
.open .rail-o b{display:block;font:600 20px/1.1 var(--sans);color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.open .kicker{grid-column:2;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:20px}
.open h1{grid-column:2;margin:0;font:350 clamp(40px,6.2vw,86px)/.98 var(--serif);letter-spacing:-.028em;text-wrap:balance;max-width:16ch}
.open h1 em{font-style:italic;font-weight:300;color:var(--ink-2)}
.open h1 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.12em;text-decoration-color:var(--accent)}
.open .dek{grid-column:2;margin:24px 0 0;font:300 clamp(20px,2.2vw,26px)/1.36 var(--serif);color:var(--ink-2);max-width:34ch;text-wrap:balance}
.open .byline{grid-column:2;margin-top:26px;display:flex;flex-wrap:wrap;gap:6px 22px;font:400 13px/1.4 var(--sans);color:var(--ink-2)}
.open .byline b{font-weight:600;color:var(--ink)}
figure.hero{margin:0 0 8px}
figure.hero .ph{width:100%;aspect-ratio:21/9;overflow:hidden;background:var(--rule-2)}
figure.hero img{width:100%;height:100%;object-fit:cover;object-position:center 45%}
figure.hero figcaption{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font:400 12px/1.4 var(--sans);color:var(--ink-3)}

/* ── Three-column story grid: rail · text · margin ── */
.story{display:grid;grid-template-columns:var(--rail) minmax(0,var(--measure)) 1fr;column-gap:var(--gap);padding-block:44px 24px}
.rail{position:sticky;top:86px;align-self:start;display:grid;gap:26px}
.rail .toc{display:grid;gap:9px;font:400 13px/1.35 var(--sans)}
.rail .toc a{color:var(--ink-3);padding-left:10px;border-left:2px solid transparent;transition:color .2s,border-color .2s}
.rail .toc a:hover{color:var(--ink)}
.rail .toc a.on{color:var(--ink);border-left-color:var(--accent)}
.rail .toc .grp{font:500 10px/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.rail .meta{font:400 12px/1.5 var(--sans);color:var(--ink-3)}
.rail .meta b{display:block;font-weight:600;color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.text{grid-column:2;min-width:0}
.margin{grid-column:3;min-width:0}

/* thesis box */
.thesis{margin:0 0 44px;padding:22px 0 24px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.thesis .label{margin-bottom:12px;color:var(--ink)}
.thesis ol{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:12px}
.thesis li{counter-increment:t;display:grid;grid-template-columns:26px 1fr;font:400 19px/1.42 var(--serif)}
.thesis li::before{content:counter(t);font:600 12px/1 var(--sans);color:var(--accent);padding-top:7px;font-variant-numeric:tabular-nums}
.thesis li a:hover{color:var(--accent)}
.thesis li small{display:block;font:400 12px/1.4 var(--sans);color:var(--ink-3);margin-top:3px}

/* figures strip */
.figs{margin:32px 0 40px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.figs div{padding:18px 16px 18px 0}
.figs div+div{padding-left:16px;border-left:1px solid var(--rule-2)}
.figs b{display:block;font:300 38px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.figs span{display:block;margin-top:8px;font:400 12px/1.4 var(--sans);color:var(--ink-2)}

blockquote.pull{margin:48px 0;padding:0;border:0;font:italic 300 clamp(28px,3.3vw,40px)/1.18 var(--serif);letter-spacing:-.015em;text-wrap:balance}
blockquote.pull::before{content:"";display:block;width:48px;height:2px;background:var(--live);margin-bottom:20px}
blockquote.pull cite{display:block;margin-top:14px;font:400 13px/1.4 var(--sans);font-style:normal;color:var(--ink-3)}
blockquote.pull a:hover{color:var(--accent)}

/* ── Front page ── */
.edition{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);column-gap:var(--gap);padding-block:40px;border-top:1px solid var(--rule)}
.edition>.lh{display:grid;gap:10px;align-content:start;padding-top:4px}
.edition>.lh h2{margin:0;font:400 28px/1.1 var(--serif);letter-spacing:-.015em}
.edition>.lh h2 a:hover{color:var(--accent)}
.edition>.lh p{margin:0;font:400 12.5px/1.5 var(--sans);color:var(--ink-3)}
.edition>.lh .more{font:500 12px/1.3 var(--sans);color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lead-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px}
.lead-row .ph{aspect-ratio:3/2;overflow:hidden;background:var(--rule-2)}
.lead-row img,.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.lead-row a:hover img,.tile a:hover img{transform:scale(1.025)}
.lead-row h3{margin:0 0 10px;font:400 32px/1.08 var(--serif);letter-spacing:-.018em;text-wrap:balance}
.lead-row a:hover h3,.hl a:hover h3,.tile a:hover h3{color:var(--accent)}
.lead-row p{margin:0;font:300 18px/1.45 var(--serif);color:var(--ink-2)}
.meta-l{margin-top:12px;font:400 12px/1.4 var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums}
.hl{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.hl li{padding:14px 16px 0 0}
.hl li+li{padding-left:16px;border-left:1px solid var(--rule-2)}
.hl h3{margin:0;font:400 19px/1.25 var(--serif);text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.tile .ph{aspect-ratio:4/3;overflow:hidden;background:var(--rule-2);margin-bottom:12px}
.tile h3{margin:6px 0 0;font:400 20px/1.2 var(--serif);text-wrap:balance}

.time-box{display:grid;gap:18px}
.time-box .seg{justify-self:start}
.stack{list-style:none;margin:0;padding:0;counter-reset:s;border-top:1px solid var(--ink)}
.stack li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--rule-2)}
.stack li::before{content:counter(s);font:600 12px/1 var(--sans);color:var(--accent);font-variant-numeric:tabular-nums}
.stack h3{margin:0;font:400 20px/1.25 var(--serif)}
.stack a:hover h3{color:var(--accent)}
.stack .m{font:400 12px/1 var(--sans);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.sum{font:400 12px/1.4 var(--sans);color:var(--ink-3);text-align:right}

/* routes-style table */
.routes{overflow-x:auto}
.routes table{width:100%;min-width:560px;border-collapse:collapse;font:400 14px/1.45 var(--sans)}
.routes th,.routes td{text-align:left;vertical-align:top;padding:13px 14px 13px 0;border-bottom:1px solid var(--rule-2)}
.routes thead th{font:500 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--ink)}
.routes tbody th{font:500 18px/1.25 var(--serif);width:22%}
.routes tbody th a:hover,.routes td a:hover{color:var(--accent)}
.routes tbody th small{display:block;font:400 12px/1.4 var(--sans);color:var(--ink-3);margin-top:3px}
.routes td{color:var(--ink-2);font-variant-numeric:tabular-nums}
.routes td.n{font:300 26px/1 var(--serif);color:var(--ink);width:10%}
.routes td .t{font:400 16px/1.35 var(--serif);color:var(--ink)}
.bar-i{display:block;height:3px;background:var(--rule-2);margin-top:8px}
.bar-i i{display:block;height:100%;background:var(--accent)}

/* index list */
.idx{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.idx a{display:grid;grid-template-columns:44px 96px minmax(0,1fr) 140px 64px;gap:16px;align-items:baseline;padding-block:13px;border-bottom:1px solid var(--rule-2)}
.idx .p{font:500 10px/1 var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums;opacity:.7}
.idx .d,.idx .c,.idx .t{font:400 12px/1.3 var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums}
.idx .c{color:var(--accent);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;font-weight:500}
.idx .t{text-align:right}
.idx h3{margin:0;font:400 19px/1.3 var(--serif)}
.idx a:hover h3{color:var(--accent)}
.idx a:hover{background:var(--sheet)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chips button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 13px;font:400 13px/1.3 var(--sans);cursor:pointer;min-height:34px}
.chips button sup{font-size:10px;color:var(--ink-3);margin-left:3px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.morebtn{display:flex;justify-content:center;margin-top:24px}
.btn-line{border:1px solid var(--ink);background:none;border-radius:999px;padding:11px 20px;font:500 13px/1 var(--sans);cursor:pointer}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.peek{position:fixed;z-index:40;width:240px;aspect-ratio:4/3;pointer-events:none;overflow:hidden;opacity:0;transform:translate(24px,-50%);transition:opacity .15s;box-shadow:0 18px 40px -14px rgba(0,0,0,.35)}
.peek.on{opacity:1}
.peek img{width:100%;height:100%;object-fit:cover}

/* ask */
.ask{margin:52px 0 20px;padding:24px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px}
.ask h3{margin:0 0 4px;font:400 24px/1.2 var(--serif);letter-spacing:-.01em}
.ask .hint{margin:0 0 16px;font:400 13px/1.5 var(--sans);color:var(--ink-3)}
.ask-in{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:0 14px;background:var(--paper)}
.ask-in input{flex:1;border:0;background:none;outline:none;font:400 16px/1 var(--sans);padding:12px 0;min-width:0}
.qs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qs button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 13px;font:400 13px/1.3 var(--sans);cursor:pointer;min-height:34px}
.qs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ans{margin-top:16px;display:grid;gap:12px}
.ans .hit{border-top:1px solid var(--rule-2);padding-top:12px;font:400 17px/1.55 var(--serif)}
.ans .hit mark{background:var(--accent-soft);color:inherit;padding:0 2px}
.ans .cite{display:inline-block;margin-top:6px;border:0;background:none;padding:0;cursor:pointer;font:500 12px/1 var(--sans);color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.ans .none{font:400 14px/1.5 var(--sans);color:var(--ink-3)}

.cta{margin:44px 0 0;padding:26px 0;border-top:1px solid var(--ink);display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.cta p{margin:0;max-width:30ch;font:400 21px/1.35 var(--serif)}
.cta .acts{display:flex;gap:10px;flex-wrap:wrap}
.cta a{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);font:500 14px/1 var(--sans);padding:14px 20px;border-radius:999px}
.cta a.wa{background:none;color:var(--ink);border:1px solid var(--rule)}
.cta a.wa svg{fill:var(--wa)}

.ledger{margin:48px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font:400 13px/1.5 var(--sans);color:var(--ink-2)}
.ledger b{display:block;margin-bottom:6px;font:500 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ledger .watch{color:var(--ink)}
.ledger .watch::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:8px;vertical-align:1px}
.ledger a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ── Article body ── */
.art-body h2{font:400 32px/1.12 var(--serif);letter-spacing:-.015em;margin:56px 0 18px;text-wrap:balance;scroll-margin-top:84px}
.art-body h3{font:italic 400 24px/1.2 var(--serif);margin:36px 0 12px;scroll-margin-top:84px}
.art-body p,.art-body li{text-wrap:pretty}
.art-body p{margin:0 0 22px;position:relative}
.art-body p.n::before{content:attr(data-p);position:absolute;left:-44px;top:.42em;width:28px;text-align:right;font:500 10px/1 var(--sans);color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums;opacity:.55}
.art-body p.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.art-body .nac-drop::first-letter,.drop::first-letter{float:left;font:400 5.1em/.8 var(--serif);padding:.08em .09em 0 0;color:var(--ink)}
.art-body strong{font-weight:600}
.art-body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.art-body ul,.art-body ol{margin:0 0 22px;padding-left:22px}
.art-body li{margin-bottom:8px}
.art-body li::marker{color:var(--accent);font:600 13px var(--sans)}
.art-body blockquote{margin:44px 0;padding:0;border:0;font:italic 300 clamp(26px,3vw,36px)/1.2 var(--serif);letter-spacing:-.015em}
.art-body blockquote::before{content:"";display:block;width:48px;height:2px;background:var(--live);margin-bottom:18px}
.art-body blockquote p{margin:0}
.art-body figure{margin:30px 0}
.art-body img{height:auto}
.art-body figcaption{font:400 12px/1.4 var(--sans);color:var(--ink-3);padding-top:8px}
.art-body hr{border:0;border-top:1px solid var(--rule);margin:40px 0}
.art-body .tw{margin:28px 0 30px;overflow-x:auto}
.art-body table{width:100%;min-width:520px;border-collapse:collapse;font:400 14px/1.45 var(--sans);font-variant-numeric:tabular-nums}
.art-body th,.art-body td{text-align:left;vertical-align:top;padding:12px 14px 12px 0;border-bottom:1px solid var(--rule-2)}
.art-body thead th,.art-body tr:first-child th{font:500 11px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--ink)}
.art-body td{color:var(--ink-2)}
.art-body td:first-child{color:var(--ink);font-weight:500}
.art-body .nac-refs{display:none}
body.skim .art-body .deep{display:none}
body.skim .art-body p.lead{font-size:20px}
.srcs{margin:40px 0 0;padding-top:14px;border-top:1px solid var(--ink)}
.srcs ol{margin:10px 0 0;padding:0;list-style:none;counter-reset:r;display:grid;gap:8px}
.srcs li{counter-increment:r;display:grid;grid-template-columns:26px 1fr;font:400 14px/1.45 var(--sans)}
.srcs li::before{content:counter(r);font:600 11px/1 var(--sans);color:var(--accent);padding-top:4px}
.srcs a:hover{color:var(--accent)}
.pn{display:grid;grid-template-columns:1fr 1fr;border-block:1px solid var(--rule);margin-top:40px}
.pn a{display:block;padding:18px 18px 18px 0}
.pn a+a{padding-left:18px;border-left:1px solid var(--rule-2);text-align:right}
.pn h4{margin:6px 0 0;font:400 19px/1.25 var(--serif)}

  r.querySelectorAll('a[href]').forEach(function(a){ if (a.getAttribute('href').charAt(0) !== '#') { a.target = '_blank'; a.rel = 'noopener'; } });
  // sections by language; posts without an EN section are one VI section
  var vi = r.querySelector('#nac-vi'), en = r.querySelector('#nac-en');
  if (!vi) { vi = doc.createElement('section'); vi.id = 'nac-vi'; while (r.firstChild) vi.appendChild(r.firstChild); r.appendChild(vi); }
  [vi, en].forEach(function(sec){
    if (!sec) return; var k = sec.id === 'nac-en' ? 'en' : 'vi', n = 0, afterH = true;
    sec.querySelectorAll('h2,h3').forEach(function(h){ h.id = k + '-h' + (++n); });
    [].slice.call(sec.children).forEach(function(el){
      if (/^H[23]$/.test(el.tagName)) { afterH = true; return; }
      if (el.tagName === 'P') { el.classList.add('n'); if (afterH) { el.classList.add('lead'); afterH = false; } else el.classList.add('deep'); }
      else if (el.tagName !== 'DIV') el.classList.add('deep');
    });
  });
  return {root:r, vi:vi, en:en, refs:refs};
}
function paintArticle(id, post){
  var p = byId[id] || fromWp(post); if (!byId[id]) { byId[id] = p; }
  var body = cleanBody(post.content.rendered), hasEn = !!body.en;
  var rest = document.getElementById('art-rest'); if (!rest) return;
  if (!document.querySelector('.open h1') || document.querySelector('.open h1 .skel')) { var v = document.getElementById('view'); var y = scrollY; v.innerHTML = vArticle(id); rest = document.getElementById('art-rest'); scrollTo(0, y); }
  artLangNow = hasEn && lang === 'en' ? 'en' : 'vi';
  var heads = [].slice.call(body.vi.querySelectorAll('h2')).slice(0, 3).map(function(h){ return h.textContent.replace(/^\d+\.\s*/, '').trim(); });
  var thesis = heads.length >= 2 ? '<section class="thesis"><div class="label">' + T('Bài này đi qua', 'This piece walks through') + '</div><ol>' + heads.map(function(h){ return '<li>' + esc(h) + '</li>'; }).join('') + '</ol></section>' : '';
  var headsEn = hasEn ? [].slice.call(body.en.querySelectorAll('h2')).slice(0, 3).map(function(h){ return h.textContent.replace(/^\d+\.\s*/, '').trim(); }) : [];
  var thesisEn = headsEn.length >= 2 ? '<section class="thesis"><div class="label">This piece walks through</div><ol>' + headsEn.map(function(h){ return '<li>' + esc(h) + '</li>'; }).join('') + '</ol></section>' : '';
  rest.innerHTML =
    (!hasEn && lang === 'en' ? '<p class="empty-note" style="padding-top:0">This story is published in Vietnamese only.</p>' : '') +
    '<div class="art-body" data-al="vi"' + (artLangNow === 'vi' ? '' : ' hidden') + ' lang="vi">' + thesis + body.vi.innerHTML + '</div>' +
    (hasEn ? '<div class="art-body" data-al="en"' + (artLangNow === 'en' ? '' : ' hidden') + ' lang="en">' + thesisEn + body.en.innerHTML + '</div>' : '') +
    '<section class="ask" aria-labelledby="ask-h"><h3 id="ask-h">' + T('Hỏi bài viết', 'Ask this article') + '</h3><p class="hint">' + T('Câu trả lời là chính các câu trong bài, kèm đoạn nguồn.', 'Answers are the article’s own sentences, cited to the paragraph.') + '</p>' +
      '<label class="ask-in" for="ask-q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="ask-q" type="text" autocomplete="off" placeholder="' + T('Chi phí, thời gian, thuế, quốc tịch…', 'Cost, timeline, tax, citizenship…') + '"></label>' +
      '<div class="qs" id="ask-qs"></div><div class="ans" id="ask-ans"></div></section>' +
    (body.refs.length ? '<section class="srcs"><div class="label ink">' + T('Nguồn chính thức', 'Official sources') + '</div><ol>' + body.refs.map(function(r){ return '<li><a href="' + esc(r.u) + '" target="_blank" rel="noopener">' + esc(r.t) + ' ↗</a></li>'; }).join('') + '</ol></section>' : '') +
    cta(T('Đi qua từng con số trong bài bằng hồ sơ thật của gia đình bạn.', 'Walk through every number in this piece against your family’s actual file.')) +
    '<div class="ledger"><div><b>' + T('Phiên bản', 'Version') + '</b>' + T('Xuất bản ', 'Published ') + dot(p.d) + (post.modified && post.modified.slice(0, 10) !== p.d ? '<br>' + T('Cập nhật ', 'Updated ') + dot(post.modified.slice(0, 10)) : '<br>' + T('Chưa có đính chính.', 'No corrections.')) + '</div><div><b>' + T('Nguồn', 'Sources') + '</b>' + (body.refs.length ? body.refs.length + T(' nguồn chính thức, dẫn ở trên', ' official sources, listed above') : T('Hồ sơ và số liệu NAC', 'NAC records and data')) + '<br><a href="' + esc(p.u) + '" target="_blank" rel="noopener">' + T('Bản gốc trên blog ↗', 'Original on the blog ↗') + '</a></div><div class="watch"><b>' + T('Đang theo dõi', 'Watching') + '</b>' + (p.dest.length ? T('Thay đổi chính sách tại ', 'Policy changes in ') + p.dest.slice(0, 2).map(function(d){ return dn(destOf(d)); }).join(T(' và ', ' and ')) : T('Thay đổi chính sách liên quan', 'Related policy changes')) + '</div></div>';
  var i = sorted.indexOf(p), newer = i > 0 ? sorted[i - 1] : null, older = i >= 0 && i < sorted.length - 1 ? sorted[i + 1] : null;
  var same = sorted.filter(function(x){ return x.c === p.c && x !== p; }).slice(0, 4);
  document.getElementById('art-after').innerHTML = '<div class="story" style="padding-block:0"><div></div><div class="text">' + ((newer || older) ? '<nav class="pn">' + (older ? '<a' + L(older) + '><span class="label">← ' + T('Bài trước', 'Previous') + '</span><h4>' + esc(older.t) + '</h4></a>' : '<span></span>') + (newer ? '<a' + L(newer) + '><span class="label">' + T('Bài sau', 'Next') + ' →</span><h4>' + esc(newer.t) + '</h4></a>' : '') + '</nav>' : '') + '</div></div>' +
    (same.length ? '<section class="edition" style="margin-top:40px"><div class="lh"><h2><a href="#/muc/' + (catOf(p.c) || {}).slug + '">' + T('Cùng chuyên mục', 'More in this section') + '</a></h2></div><div class="tiles">' + same.map(function(x){ return '<div class="tile"><a' + L(x) + '>' + ph(x) + '<h3>' + esc(x.t) + '</h3></a>' + ml(x) + '</div>'; }).join('') + '</div></section>' : '');
  document.getElementById('art-ver').textContent = T('Bài viết sống', 'Living article') + (post.modified && post.modified.slice(0, 10) !== p.d ? ' · ' + T('cập nhật ', 'updated ') + dot(post.modified.slice(0, 10)) : ' · v1');
  articleChrome();
}
function activeBody(){ return document.querySelector('.art-body[data-al]:not([hidden])'); }
function articleChrome(){
  var b = activeBody(); if (!b) return;
  document.body.classList.toggle('skim', depth === 'skim');
  var n = 0; b.querySelectorAll('p.n').forEach(function(p){ if (getComputedStyle(p).display === 'none') { p.removeAttribute('data-p'); return; } p.setAttribute('data-p', '¶' + (++n)); });
  var toc = document.getElementById('toc');
  if (toc) toc.innerHTML = [].slice.call(b.querySelectorAll('h2')).map(function(h){ return '<a href="#/bai/' + current().id + '/' + h.id + '" data-h="' + h.id + '">' + esc(h.textContent.replace(/^\d+\.\s*/, '').trim()) + '</a>'; }).join('');
  var words = (b.textContent || '').split(/\s+/).length, full = Math.max(1, Math.round(words / 220)), vis = 0;
  b.querySelectorAll('p.n,li').forEach(function(x){ if (x.offsetParent) vis += (x.textContent || '').split(/\s+/).length; });
  var skimMin = Math.max(1, Math.round(vis / 220));
  document.getElementById('rail-rt').textContent = (depth === 'skim' ? skimMin : full) + T(' phút', ' min');
  document.getElementById('rail-rtl').textContent = depth === 'skim' ? T('đọc lướt', 'skim') : T('đọc đầy đủ', 'full read');
  // ask chips from the article's own headings
  var qs = document.getElementById('ask-qs');
  if (qs) qs.innerHTML = ['chi phí|cost', 'thời gian|time', 'thuế|tax', 'quốc tịch|citizenship', 'rủi ro|risk'].map(function(k){ var w = k.split('|'); return '<button type="button" data-ask="' + (lang === 'en' ? w[1] : w[0]) + '" aria-pressed="false">' + (lang === 'en' ? w[1] : w[0]) + '</button>'; }).join('');
  spy(); prog();
}
function ask(q){
  var b = activeBody(), out = document.getElementById('ask-ans'); if (!b || !out) return;
  var terms = norm(q).split(' ').filter(function(t){ return t.length > 1; }); if (!terms.length) { out.innerHTML = ''; return; }
  if (depth === 'skim') { depth = 'full'; paintDepth(); }
  var hits = [];
  b.querySelectorAll('p.n,li').forEach(function(p){
    var sentences = (p.textContent || '').split(/(?<=[.!?])\s+/);
    sentences.forEach(function(s){ var ns = norm(s), score = 0; terms.forEach(function(t){ if (ns.indexOf(t) >= 0) score++; }); if (score) hits.push({s:s, p:p, score:score}); });
  });
  hits.sort(function(a, b){ return b.score - a.score; });
  hits = hits.slice(0, 3);
  out.innerHTML = hits.length ? '' : '<div class="none">' + T('Bài này không nói trực tiếp về điều đó. Hỏi cố vấn NAC để có câu trả lời cho trường hợp của bạn.', 'This piece doesn’t address that directly. Ask a NAC advisor for an answer on your case.') + '</div>';
  hits.forEach(function(h){
    var d = document.createElement('div'); d.className = 'hit';
    var s = esc(h.s);
    d.innerHTML = '“' + s + '”';
    var tag = h.p.getAttribute('data-p') || '';
    var c = document.createElement('button'); c.type = 'button'; c.className = 'cite'; c.textContent = T('Nguồn: đoạn ', 'Source: ') + (tag || '¶');
    c.addEventListener('click', function(){ h.p.scrollIntoView({behavior:'smooth', block:'center'}); h.p.classList.remove('flash'); void h.p.offsetWidth; h.p.classList.add('flash'); });
    d.appendChild(document.createElement('br')); d.appendChild(c); out.appendChild(d);
  });
}
function loadArticle(id, anchor){
  function go(post){ paintArticle(id, post); if (anchor) { var t = document.getElementById(anchor); if (t) t.scrollIntoView(); } }
  if (artCache[id] && artCache[id].content) return go(artCache[id]);
  fetch(WP + '/posts/' + id + '?_embed=wp:featuredmedia,wp:term').then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(post){ artCache[id] = post; if (current().id === String(id)) go(post); })
    .catch(function(){ var rest = document.getElementById('art-rest'), p = byId[id]; if (rest) rest.innerHTML = '<p class="empty-note">' + T('Không tải được nội dung lúc này.', 'The story could not load right now.') + (p ? ' <a style="color:var(--accent)" href="' + esc(p.u) + '" target="_blank" rel="noopener">' + T('Đọc trên blog ↗', 'Read on the blog ↗') + '</a>' : '') + '</p>'; });
}

/* ================= ROUTER + CHROME ================= */
function current(){ var h = location.hash.replace(/^#\/?/, ''), parts = h.split('?')[0].split('/'); return {r:parts[0] || '', id:parts[1] || '', sub:parts[2] || '', q:decodeURIComponent((h.split('?q=')[1] || '').replace(/\+/g, ' '))}; }
var lastKey = '';
function route(){
  var c = current(), key = c.r + '/' + c.id;
  if (key === lastKey && c.r === 'bai' && c.sub) { var t = document.getElementById(c.sub); if (t) t.scrollIntoView({behavior:'smooth'}); return; }
  var same = key === lastKey; lastKey = key;
  var v = document.getElementById('view'), html;
  if (c.r === '') html = vHome();
  else if (c.r === 'muc') html = vCat(c.id);
  else if (c.r === 'diem-den') html = c.id ? vDest(c.id) : vDestIndex();
  else if (c.r === 'bai') html = vArticle(c.id);
  else if (c.r === 'tim') html = vSearch(c.q);
  else if (c.r === 'gioi-thieu') html = vAbout();
  else html = vNotFound();
  var y = scrollY; v.innerHTML = html;
  document.getElementById('depth').hidden = c.r !== 'bai';
  document.body.classList.toggle('skim', c.r === 'bai' && depth === 'skim');
  if (c.r === '') afterHome();
  if (c.r === 'tim') { renderSearch(); var sq = document.getElementById('sq'); sq.focus(); sq.setSelectionRange(sq.value.length, sq.value.length); }
  if (c.r === 'bai') loadArticle(c.id, c.sub);
  scrollTo(0, same ? y : 0);
  renderNav(c); prog();
}
function renderNav(c){
  var here = c.r === 'muc' ? c.id : c.r;
  document.getElementById('nav').innerHTML = '<a href="#/"' + (here === '' ? ' aria-current="page"' : '') + '>' + T('Trang nhất', 'Front page') + '</a>' +
    CATS.map(function(x){ return '<a href="#/muc/' + x.slug + '"' + (here === x.slug ? ' aria-current="page"' : '') + '>' + esc(lang === 'en' ? x.en : x.vi) + '</a>'; }).join('') +
    '<a href="#/diem-den"' + (here === 'diem-den' ? ' aria-current="page"' : '') + '>' + T('Điểm đến', 'Destinations') + '</a><a href="#/gioi-thieu"' + (here === 'gioi-thieu' ? ' aria-current="page"' : '') + '>' + T('Giới thiệu', 'About') + '</a>';
  var sec = '';
  if (c.r === 'bai' && byId[c.id]) sec = cat(byId[c.id].c) + (byId[c.id].dest[0] ? ' · ' + dn(destOf(byId[c.id].dest[0])) : '');
  else if (c.r === 'muc') { CATS.forEach(function(x){ if (x.slug === c.id) sec = lang === 'en' ? x.en : x.vi; }); }
  else if (c.r === 'diem-den') sec = T('Điểm đến', 'Destinations');
  else if (c.r === '') sec = T('Ấn bản ', 'Edition · ') + dot(new Date().toISOString().slice(0, 10));
  document.getElementById('mast-sec').textContent = sec;
}
var bar = document.getElementById('progress'), bt = document.getElementById('back-top');
function prog(){ var t = document.querySelector('#art-rest'); if (!t || current().r !== 'bai') { bar.style.width = '0'; return; } var r = t.getBoundingClientRect(), h = r.height - innerHeight * .6; bar.style.width = Math.max(0, Math.min(1, -r.top / Math.max(h, 1))) * 100 + '%'; }
function spy(){ var b = activeBody(); if (!b) return; var on = null; b.querySelectorAll('h2').forEach(function(h){ if (h.getBoundingClientRect().top < innerHeight * .35) on = h.id; }); document.querySelectorAll('#toc a').forEach(function(l){ l.classList.toggle('on', l.getAttribute('data-h') === on); }); }
addEventListener('scroll', function(){ prog(); spy(); bt.classList.toggle('on', scrollY > 900); }, {passive:true});
function paintDepth(){ document.getElementById('d-skim').setAttribute('aria-pressed', String(depth === 'skim')); document.getElementById('d-full').setAttribute('aria-pressed', String(depth === 'full')); try { localStorage.setItem('nt-depth', depth); } catch (e) {} if (current().r === 'bai') articleChrome(); }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-vi][data-en]').forEach(function(el){ el.textContent = el.getAttribute('data-' + lang); });
  document.getElementById('l-vi').setAttribute('aria-pressed', String(lang === 'vi'));
  document.getElementById('l-en').setAttribute('aria-pressed', String(lang === 'en'));
  document.getElementById('d-skim').textContent = T('Đọc lướt', 'Skim'); document.getElementById('d-full').textContent = T('Đầy đủ', 'Full');
}
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-dest],[data-budget],[data-ask],#more,#l-vi,#l-en,#d-skim,#d-full,#back-top'); if (!t) return;
  if (t.id === 'back-top') return scrollTo({top:0, behavior:'smooth'});
  if (t.id === 'l-vi' || t.id === 'l-en') { lang = t.id === 'l-en' ? 'en' : 'vi'; try { localStorage.setItem('nt-lang', lang); } catch (x) {} applyLang(); lastKey = ''; var y = scrollY, c = current(); route(); if (c.r !== 'bai') scrollTo(0, y); return; }
  if (t.id === 'd-skim' || t.id === 'd-full') { depth = t.id === 'd-skim' ? 'skim' : 'full'; return paintDepth(); }
  if (t.id === 'more') { st.shown += 20; return renderIndex(); }
  if (t.hasAttribute('data-budget')) { st.budget = +t.getAttribute('data-budget'); return renderStack(); }
  if (t.hasAttribute('data-dest')) { st.dest = t.getAttribute('data-dest'); st.shown = 20; return renderIndex(); }
  if (t.hasAttribute('data-ask')) { document.querySelectorAll('#ask-qs button').forEach(function(b){ b.setAttribute('aria-pressed', String(b === t)); }); document.getElementById('ask-q').value = t.getAttribute('data-ask'); return ask(t.getAttribute('data-ask')); }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'sq') { renderSearch(); history.replaceState(null, '', '#/tim?q=' + encodeURIComponent(e.target.value)); }
  if (e.target.id === 'ask-q') ask(e.target.value);
});
document.addEventListener('keydown', function(e){ if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); location.hash = '#/tim'; } });

/* ================= BOOT ================= */
var cached = null; try { cached = JSON.parse(sessionStorage.getItem('nt_posts2') || 'null'); } catch (e) {}
prep(cached && cached.length ? cached : JSON.parse(document.getElementById('nt-data').textContent));
applyLang(); paintDepth(); route();
addEventListener('hashchange', route);
fetch(WP + '/posts?per_page=100&status=publish&_embed=wp:featuredmedia,wp:term&_fields=id,date,modified,link,title,excerpt,content,_links,_embedded')
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(rows){
    var data = rows.map(fromWp).filter(function(p){ return p.t; }); if (data.length < 5) return;
    rows.forEach(function(r){ artCache[r.id] = r; });
    try { sessionStorage.setItem('nt_posts2', JSON.stringify(data)); } catch (x) {}
    isLive = true; prep(data);
    var c = current(); if (c.r !== 'bai' && c.r !== 'tim') { lastKey = ''; var y = scrollY; route(); scrollTo(0, y); }
    else if (c.r === 'bai') { var el = document.querySelector('.kicker .live'); }
  }).catch(function(){ isLive = false; });
})();
</script>
